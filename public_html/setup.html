<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRIA | İlk kurulum</title><link rel="stylesheet" href="/style.css"><link rel="icon" href="/mark.svg"><script src="/setup.js" defer></script></head><body><main class="login"><div class="login-art" aria-hidden="true"></div><section class="login-panel"><div class="brand"><div class="wordmark"><span>EKŞİOĞLU</span><span class="second">TRI▲</span></div><span class="brand-caption">İş Yönetim Sistemi</span></div><h1>İlk kurulum</h1><p class="subtext">İlk yönetici hesabınızı oluşturun. Kurulum tamamlandığında bu işlem kilitlenir.</p><form id="setup-form"><div class="error" role="alert"></div><label class="field"><span>Kurulum anahtarı</span><input name="setup_key" type="password" required minlength="48" maxlength="128" autocomplete="off"></label><label class="field"><span>Ad ve soyad</span><input name="name" required maxlength="100" autocomplete="name"></label><label class="field"><span>Kurumsal e-posta</span><input name="email" type="email" required maxlength="200" autocomplete="username" placeholder="ad.soyad@eksioglutria.com"></label><label class="field"><span>Şifre</span><input name="password" type="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label><label class="field"><span>Şifre tekrarı</span><input name="confirm" type="password" required minlength="12" autocomplete="new-password"></label><button class="primary login-submit">Yönetici hesabını oluştur</button></form><div id="success" hidden><p>Kurulum tamamlandı. Yönetici hesabınızla giriş yapabilirsiniz.</p><a class="primary" href="/admin">Yönetici girişine git</a></div></section></main></body></html>
